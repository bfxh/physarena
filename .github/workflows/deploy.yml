# Deploys PhysArena to GitHub Pages on every push to main.
#
# The site is the deliverable: opening the published URL must give a working
# lab with no local build step. Everything the engines need (the .wasm payloads
# and their emscripten glue) is part of `npm run build` output, so one
# `vite build` is the whole story.
#
# Known limitation, stated rather than hidden: GitHub Pages cannot send custom
# response headers, so the COOP/COEP headers the dev server sets are absent.
# All nine engines currently shipped are single-threaded wasm builds and do not
# need them; a multithreaded engine build would need a COOP/COEP service-worker
# shim before it works from Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency hygiene before anything ships.
      - run: npm audit --audit-level=high
      # Type gate first: a type error must never reach the bundler.
      - run: npm run typecheck
      - run: npm run build
      # UI regression gate. A build that compiles is not a build that renders:
      # the compare table freezing, a metrics column collapsing to "—", and
      # the header controls being squeezed at narrow widths all shipped
      # green builds before. This boots the real dist in a headless browser and
      # fails the job (and therefore blocks deploy) if any invariant breaks.
      # Uses the runner's preinstalled Chrome - no browser download.
      - name: UI 回归门（无头）
        env:
          UI_GATE_CHANNEL: chrome
        run: node scripts/ui-gate.mjs
      # enablement: true lets the action flip the repo's Pages source to
      # "GitHub Actions" on first deploy - without it, a fresh repository fails
      # here with "Get Pages site failed" because no Pages site exists yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green build and a "deploy: success" still do not prove the published site
  # works: the Pages base path, a hashed asset, or a copied .wasm can all be
  # wrong while every earlier step passes. This opens the real URL and checks
  # the document and its entry bundle are actually served.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 线上冒烟（真实 URL）
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/pa.html -w '%{http_code}' "${SITE_URL%/}/" || true)
            [ "$code" = "200" ] && break
            sleep 6
          done
          echo "document HTTP $code"
          [ "$code" = "200" ]
          grep -q '/physarena/assets/' /tmp/pa.html || { echo "base path missing /physarena/assets/"; exit 1; }
          asset=$(grep -oE '/physarena/assets/index-[A-Za-z0-9_-]+\.js' /tmp/pa.html | head -1)
          echo "entry asset: $asset"
          [ -n "$asset" ]
          acode=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}$asset")
          echo "asset HTTP $acode"
          [ "$acode" = "200" ]
          # the self-test bundle the engines load must be served too
          wcode=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL%/}/physarena/vendor/vxl/vxl_phys_wasm.wasm" || true)
          echo "vxl wasm HTTP $wcode"
          [ "$wcode" = "200" ]
