# Deploys PhysArena to GitHub Pages on every push to main.
#
# The site is the deliverable: opening the published URL must give a working
# lab with no local build step. Everything the engines need (the .wasm payloads
# and their emscripten glue) is part of `npm run build` output, so one
# `vite build` is the whole story.
#
# Known limitation, stated rather than hidden: GitHub Pages cannot send custom
# response headers, so the COOP/COEP headers the dev server sets are absent.
# All nine engines currently shipped are single-threaded wasm builds and do not
# need them; a multithreaded engine build would need a COOP/COEP service-worker
# shim before it works from Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      entry_asset: ${{ steps.entry.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency hygiene before anything ships.
      - run: npm audit --audit-level=high
      # vendor 漂移门：必须在 npm run build 之前（prebuild 会重写 vendor）。提交滞后于
      # 锁版本的 vendored 引擎载荷在此拦下，避免部署一份与锁版本对不上的二进制。
      - name: vendor 漂移门（public/vendor == 锁版本引擎包产物）
        run: node scripts/check-vendor-drift.mjs
      # Type gate first: a type error must never reach the bundler.
      - run: npm run typecheck
      # 自检矩阵 ratchet 护栏契约自测（秒级）：与 ci.yml 同款，确保 main 推送也验证护栏逻辑。
      - name: 自检矩阵 ratchet 契约自测
        run: node scripts/selftest-ratchet.test.mjs
      - run: npm run build
      # UI regression gate. A build that compiles is not a build that renders:
      # the compare table freezing, a metrics column collapsing to "—", and
      # the header controls being squeezed at narrow widths all shipped
      # green builds before. This boots the real dist in a headless browser and
      # fails the job (and therefore blocks deploy) if any invariant breaks.
      # Uses the runner's preinstalled Chrome - no browser download.
      - name: UI 回归门（无头）
        env:
          UI_GATE_CHANNEL: chrome
        run: node scripts/ui-gate.mjs
      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-gate-report-build
          path: out/ui-gate-report.json
          if-no-files-found: warn
      # enablement: true lets the action flip the repo's Pages source to
      # "GitHub Actions" on first deploy - without it, a fresh repository fails
      # here with "Get Pages site failed" because no Pages site exists yet.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      # Record the freshly built entry bundle so verify-live can wait for THIS
      # deployment to propagate instead of checking the previous one.
      - name: 记录入口 bundle
        id: entry
        run: echo "name=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # WASM 源码完整性门：从 vxl_wasm.build.json 钉住的 BSHSQ rev 重建 wasm，
  # 与已提交的 public/vendor/vxl/vxl_phys_wasm.wasm 逐字节比对。不一致 =>
  # 已提交 wasm 与 BSHSQ 源码脱节，必须阻断发布（否则会部署一份无法溯源的二进制）。
  vxl-wasm-integrity:
    uses: ./.github/workflows/vxl-wasm-integrity.yml

  # 预部署验收（**事前拦截**，非事后检测）：渲染器像素级 + 场景冒烟，对着**本地构建产物**跑，
  # deploy 依赖本 job——渲染器/场景坏了在这里就拦住，坏站点永远不会上线。此前这两项放在
  # gate-live（deploy 之后）只做事后检测，坏图已经上线才红。与 build 并行，不串行拖慢。
  # 渲染器脚本跳过 unavailable 渲染器（如 SwiftShader 上的 WebGPU）；本地 dist 与线上同源
  # 同构建、行为一致（线上版已实测通过），verify-live 再对账线上字节 == 提交字节兜底。
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 起 vite preview（serve dist，base /physarena/ 于 4173）→ 等就绪 → 跑两项验收 →
      # trap EXIT 兜底杀服务器。同一步内完成，避免后台进程跨 step 被回收。
      - name: 预部署验收（渲染器 + 场景，对本地 dist）
        env:
          ARENA_URL: http://localhost:4173/physarena
          ARENA_CHANNEL: chrome
        run: |
          set -e
          nohup npm run preview >/tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/physarena/ || true)
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { echo "preview failed to start"; cat /tmp/preview.log; exit 1; }
          echo "preview up"
          node scripts/verify-renderers.mjs --engines
          node scripts/verify-scenarios.mjs
      - name: 上传验收报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-prebuilt
          path: |
            out/verify-renderers.json
            out/verify-scenarios.json
          if-no-files-found: warn

  deploy:
    needs: [build, vxl-wasm-integrity, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # A green build and a "deploy: success" still do not prove the published site
  # works: the Pages base path, a hashed asset, or a copied .wasm can all be
  # wrong while every earlier step passes. This opens the real URL and checks
  # the document and its entry bundle are actually served.
  verify-live:
    # needs BOTH: deploy for the URL, build for the freshly-built entry bundle
    # name. A job can only read outputs of jobs listed in its needs - with only
    # `deploy` here, ${{ needs.build.outputs.entry_asset }} silently resolved to
    # empty and the propagation wait became a no-op.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 线上冒烟（真实 URL）
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED: ${{ needs.build.outputs.entry_asset }}
        run: |
          set -euo pipefail
          # Fail loudly if the build job's output did not arrive: an empty
          # EXPECTED would turn `grep -q "$EXPECTED"` into a match-everything
          # no-op and silently skip the propagation wait.
          [ -n "$EXPECTED" ] || { echo "entry_asset output missing from build job"; exit 1; }
          echo "waiting for entry asset: $EXPECTED"
          # SITE_URL already contains the /physarena base path; asset paths are
          # rooted at the host, so build URLs from the origin, not SITE_URL.
          origin=$(printf '%s' "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          # Wait for THIS deployment: Pages propagates asynchronously, so the
          # document may still advertise the previous bundle for a while.
          found=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/pa.html -w '%{http_code}' "$origin/physarena/" || true)
            if [ "$code" = "200" ] && grep -q "$EXPECTED" /tmp/pa.html; then found=1; break; fi
            sleep 6
          done
          echo "document HTTP $code, expected asset '$EXPECTED', propagated=${found:-0}"
          [ "$code" = "200" ]
          [ -n "$found" ]
          asset=$(grep -oE '/physarena/assets/index-[A-Za-z0-9_-]+\.js' /tmp/pa.html | head -1)
          echo "entry asset: $asset"
          acode=$(curl -s -o /dev/null -w '%{http_code}' "$origin$asset")
          echo "asset HTTP $acode"
          [ "$acode" = "200" ]
          # every vendored engine payload must be served - these are copied
          # files, and a missed copy only shows up once someone loads that
          # engine on the live site.
          for p in \
            /physarena/vendor/vxl/vxl_phys_wasm.wasm \
            /physarena/vendor/havok/HavokPhysics.wasm \
            /physarena/vendor/physx/physx-js-webidl.wasm \
            /physarena/vendor/ammo/ammo.js ; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$origin$p")
            echo "$p -> $c"
            [ "$c" = "200" ]
          done
          # a wasm served with the wrong MIME fails instantiateStreaming in a way
          # no local preview would ever show
          ct=$(curl -s -o /dev/null -w '%{content_type}' "$origin/physarena/vendor/vxl/vxl_phys_wasm.wasm")
          echo "wasm content-type: $ct"
          case "$ct" in application/wasm*) ;; *) echo "bad wasm MIME"; exit 1 ;; esac

      # 部署字节级对账（线上 == 提交）：前面只验证了「能取到 + MIME 对」，没验证
      # 「取到的就是提交的那份」。构建漏拷 / Pages 缓存旧版 / base path 错都会让部署字节
      # 与提交脱节而 200+MIME 全绿——这正是「提交二进制 vs 源真值」同源缺口的部署侧延伸。
      # 把线上字节拉下来和已提交文件 sha256 比对（带传播重试，避免 CDN 抖动误报）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 部署 vendored 二进制字节对账（线上 == 提交）
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          origin=$(printf '%s' "$SITE_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          for p in \
            public/vendor/vxl/vxl_phys_wasm.wasm \
            public/vendor/havok/HavokPhysics.wasm \
            public/vendor/physx/physx-js-webidl.wasm \
            public/vendor/ammo/ammo.js ; do
            want=$(sha256sum "$p" | cut -d' ' -f1)
            url="$origin/physarena/${p#public/}"
            ok=""; got=""; code=""
            for i in $(seq 1 15); do
              code=$(curl -s -o /tmp/live.bin -w '%{http_code}' "$url")
              if [ "$code" = "200" ]; then
                got=$(sha256sum /tmp/live.bin | cut -d' ' -f1)
                [ "$want" = "$got" ] && { ok=1; break; }
              fi
              sleep 3
            done
            if [ -n "$ok" ]; then echo "OK  线上 $p == 提交 (sha256 ${got:0:12}…)"; else echo "FAIL 线上 $p 与提交不一致 (want ${want:0:12}… last code=$code last got=${got:0:12}…)"; exit 1; fi
          done

  # The decisive check: run the entire UI gate against the PUBLISHED site in a
  # real browser. verify-live proves the bytes are served; this proves the app
  # actually runs there - JS executes under the Pages base path, every wasm
  # instantiates, all nine engines boot and step, all renderers draw. None of
  # that can be proven from a local preview, because the local build is served
  # from the same origin the bundle was built for.
  gate-live:
    # deploy for the URL; verify-live so this only runs once the new build has
    # actually propagated (otherwise it would test the previous deployment).
    needs: [deploy, verify-live]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UI 回归门（对线上部署站）
        env:
          UI_GATE_CHANNEL: chrome
          UI_GATE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/ui-gate.mjs
      # 注：渲染器/场景像素级 + 冒烟验收已移到并行 acceptance job（deploy 之前、事前拦截），
      # 此处不再重复——线上字节由 verify-live 对账，acceptance 已验证的同源 dist 即线上内容。
      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-gate-report-live
          path: out/ui-gate-report.json
          if-no-files-found: warn
      # capture 模式下 ratchet 写出的基线（out/selftest-baseline.json）；主推送 ci.yml 不跑，
      # 故此处也上传，供人工落到 scripts/ 激活护栏。
      - name: 上传自检基线（capture 产物）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selftest-baseline-live
          path: out/selftest-baseline.json
          if-no-files-found: warn
