# Quality gate for pull requests and non-main branches.
#
# deploy.yml already runs typecheck + build + the UI gate on main (nothing
# deploys unverified), but until now a pull request only ran the naming gate -
# so a UI regression could sit in a branch, merge, and only then turn main red
# after the fact. This workflow runs the same quality gate *before* merge, so a
# broken change is caught at the PR instead of after it lands.
#
# push to main is excluded on purpose: deploy.yml owns main and already performs
# these steps, and duplicating them would build the site twice per commit.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# 取消同一 PR/分支上被新提交顶掉的旧运行，省 CI 分钟、避免过期结果误导。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WASM 源码完整性门（PR / 非 main 分支同样要拦）：从钉住 BSHSQ rev 重建 wasm
  # 与已提交文件逐字节比对，避免脱节 wasm 合入后才在 main 上才暴露。
  vxl-wasm-integrity:
    uses: ./.github/workflows/vxl-wasm-integrity.yml

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency hygiene: a shipping lab should not carry known advisories.
      - run: npm audit --audit-level=high
      # vendor 漂移门：public/vendor 的引擎载荷（Havok/PhysX/Bullet wasm、ammo.js）
      # 必须等于锁版本 node_modules 产物。必须在 npm run build 之前跑——prebuild 会重写
      # vendor，跑晚了就测不出「提交滞后于锁版本」的脱节。
      - name: vendor 漂移门（public/vendor == 锁版本引擎包产物）
        run: node scripts/check-vendor-drift.mjs
      # 上游漂移探针的 sh() 契约回归自测（秒级）：锁死「成功返回 ''（可能是空串）/
      # 失败返回 null」。真值判断会把「成功但只写 stderr」的命令误判为失败、静默跳过
      # 分支——这个坑已真实发生过（表现为永远「无法计数」），用测试钉死防复发。
      - name: 上游漂移探针契约自测
        run: node scripts/upstream-drift.test.mjs
      # 自检矩阵 ratchet 护栏契约自测（秒级）：证明护栏对「新增 fail」敏感、不误报修复。
      - name: 自检矩阵 ratchet 契约自测
        run: node scripts/selftest-ratchet.test.mjs
      - run: npm run typecheck
      - run: npm run build
      # Same headless UI regression gate as main - see scripts/ui-gate.mjs.
      # Uses the runner's preinstalled Chrome; no browser download.
      - name: UI 回归门（无头）
        env:
          UI_GATE_CHANNEL: chrome
        run: node scripts/ui-gate.mjs
      # 渲染器 + 场景验收（预合并）：与 deploy.yml 的 acceptance job 同款，对本地 dist 跑，
      # 让 PR/分支推送在合入前就抓渲染器/场景回归（deploy 的 acceptance 只覆盖 main 部署）。
      # serve 必须用 localhost（vite preview 默认绑 localhost，127.0.0.1 连不上会假红）。
      - name: 渲染器 + 场景验收（对本地 dist）
        env:
          ARENA_URL: http://localhost:4173/physarena
          ARENA_CHANNEL: chrome
        run: |
          set -e
          nohup npm run preview >/tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4173/physarena/ || true)
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { echo "preview failed to start"; cat /tmp/preview.log; exit 1; }
          echo "preview up"
          node scripts/verify-renderers.mjs --engines
          node scripts/verify-scenarios.mjs
      - name: 上传验收报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-ci
          path: |
            out/verify-renderers.json
            out/verify-scenarios.json
          if-no-files-found: warn
      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-gate-report
          path: out/ui-gate-report.json
          if-no-files-found: warn
      # capture 模式下 ratchet 写出的基线（out/selftest-baseline.json），供人工落到
      # scripts/ 激活护栏；ratchet 模式不产生此文件，warn 不阻断。
      - name: 上传自检基线（capture 产物）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selftest-baseline
          path: out/selftest-baseline.json
          if-no-files-found: warn