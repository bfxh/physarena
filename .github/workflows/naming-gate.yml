# 命名纪律门（用户命名宪法：除主名外，一切命名必须专业）。
# 本仓主名 = **PhysArena**（浏览器物理引擎测试场）；仓内第 9 个自研引擎的显示名
# = **BSHSQ-Solver**（该引擎本体是 bfxh/BSHSQ，原 RUST-WL）。
# 判据与豁免模型见 scripts/naming_gate.py 头注；与 ADV 同一门脚本，各自仓内自包含。
name: naming-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # 本仓无退役旧名（PhysArena 是主名）；引擎技术标识 vxl-phys 白名单记账
      - name: 命名纪律门（占位词/杂物）
        run: python -X utf8 scripts/naming_gate.py --allow-name vxl-phys --allow-name vxl_phys
